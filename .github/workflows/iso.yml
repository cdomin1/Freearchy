name: iso

# Builds the amd64 vellum binary on real FreeBSD and remasters the
# official 15.1 memstick image into a bootable Vellum installer.
#
# Trigger manually (pre-alpha smoke test) or by pushing a v* tag (also
# creates a release with the img.xz attached — uploaded straight from the
# VM, so the run does not depend on vmactions' workdir sync).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    strategy:
      matrix:
        include:
          # vmactions needs an Intel macOS runner for amd64 FreeBSD;
          # arm runners (Apple Silicon) run aarch64 guests natively.
          - arch: amd64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Build vellum + remaster image inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release: "15.1"
          mem: 6144
          usesh: true
          # no workspace sync needed — the VM clones the repo itself;
          # rsync sync is flaky on this action and was killing runs
          sync: "no"
          copyback: false
          env: |
            GH_TOKEN
            GITHUB_REF_NAME
            GITHUB_REF_TYPE
            ARCH
          run: |
            set -ex
            pkg install -y rust git-lite curl
            git clone --depth 1 ${GITHUB_REF_TYPE:+--branch "${GITHUB_REF_NAME}"} \
                https://github.com/cdomin1/Vellum.git ~/vellum || \
                git clone --depth 1 https://github.com/cdomin1/Vellum.git ~/vellum
            cd ~/vellum
            cargo build --release -p vellum
            strip target/release/vellum
            VELLUM_BIN="$PWD/target/release/vellum" sh image/build-image.sh 15.1
            xz -T0 FreeBSD-15.1-RELEASE-${ARCH}-memstick.img
            # Tag builds: create-or-reuse the release, upload the img.xz.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                REPO=cdomin1/Vellum
                TAG="$GITHUB_REF_NAME"
                API="https://api.github.com/repos/$REPO"
                RID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                        "$API/releases/tags/$TAG" | sed -n 's/.*"id": \([0-9]*\).*/\1/p' | head -1)
                if [ -z "$RID" ]; then
                    RID=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":true}" \
                        "$API/releases" | sed -n 's/.*"id": \([0-9]*\).*/\1/p' | head -1)
                fi
                [ -n "$RID" ] || { echo "!! could not create/get release" >&2; exit 1; }
                curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Content-Type: application/octet-stream" \
                    --data-binary @FreeBSD-15.1-RELEASE-${ARCH}-memstick.img.xz \
                    "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=vellum-15.1-${ARCH}-memstick.img.xz" \
                    >/dev/null
                echo "uploaded vellum-15.1-${ARCH}-memstick.img.xz to release $RID"
            fi
