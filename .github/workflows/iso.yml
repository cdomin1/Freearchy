name: iso

# Builds the amd64 vellum binary on real FreeBSD and remasters the
# official 15.1 memstick image into a bootable Vellum installer.
#
# Trigger manually (pre-alpha smoke test) or by pushing a v* tag (also
# creates a release with the img.xz attached — uploaded straight from the
# VM, so the run does not depend on vmactions' workdir sync).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    strategy:
      matrix:
        include:
          # vmactions needs an Intel macOS runner for amd64 FreeBSD;
          # arm runners (Apple Silicon) run aarch64 guests natively.
          - arch: amd64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # The VM's disk image lives on the host — Xcode + friends are ~20GB
      # the FreeBSD build will never touch.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode*.app /Applications/Xcode*.xip || true
          rm -rf ~/Library/Developer/Xcode/DerivedData ~/Library/Developer/CoreSimulator || true
          df -h /
      - name: Build vellum + remaster image inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release: "15.1"
          mem: 6144
          usesh: true
          # no workspace sync needed — the VM clones the repo itself;
          # rsync sync is flaky on this action and was killing runs
          sync: "no"
          copyback: false
          envs: GH_TOKEN GITHUB_REF_NAME GITHUB_REF_TYPE GITHUB_REPOSITORY ARCH
          run: |
            set -ex
            pkg install -y rust git-lite curl
            git clone --depth 1 ${GITHUB_REF_TYPE:+--branch "${GITHUB_REF_NAME}"} \
                "https://github.com/${GITHUB_REPOSITORY}.git" ~/vellum || \
                git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" ~/vellum
            cd ~/vellum
            cargo build --release -p vellum -p vellum-wm
            strip target/release/vellum target/release/vellum-wm
            # runner disk is tight — cargo target + pkg caches are GBs
            cp target/release/vellum target/release/vellum-wm /tmp/
            cargo clean
            pkg clean -ay
            VELLUM_BIN=/tmp/vellum WM_BIN=/tmp/vellum-wm sh image/build-image.sh 15.1
            VELLUM_BIN=/tmp/vellum WM_BIN=/tmp/vellum-wm \
                sh image/build-iso.sh 15.1
            # Target-based names: usb-installer = dd to a stick for bare
            # metal; vm-installer = real bootable ISO for Parallels/UTM/VBox.
            IMG=$(ls FreeBSD-15.1-RELEASE-*-memstick.img | head -1)
            mv "$IMG" "vellum-15.1-${ARCH}-usb-installer.img"
            xz -T0 "vellum-15.1-${ARCH}-usb-installer.img"
            xz -T0 "vellum-15.1-${ARCH}-vm-installer.iso"
            # Tag builds: create-or-reuse the release, upload the assets.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                REPO="$GITHUB_REPOSITORY"
                TAG="$GITHUB_REF_NAME"
                API="https://api.github.com/repos/$REPO"
                RID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                        "$API/releases/tags/$TAG" | sed -n 's/.*"id": \([0-9]*\).*/\1/p' | head -1)
                if [ -z "$RID" ]; then
                    RID=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":true}" \
                        "$API/releases" | sed -n 's/.*"id": \([0-9]*\).*/\1/p' | head -1)
                fi
                [ -n "$RID" ] || { echo "!! could not create/get release" >&2; exit 1; }
                # retagged builds: drop stale assets so uploads don't 422
                for ASSET in "vellum-15.1-${ARCH}-usb-installer.img.xz" \
                             "vellum-15.1-${ARCH}-vm-installer.iso.xz"; do
                    OLD=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$RID/assets" \
                        | tr -d '\n' | tr '{' '\n' | grep "\"name\": *\"$ASSET\"" \
                        | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -1)
                    [ -n "$OLD" ] && curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                        "$API/releases/assets/$OLD" && echo "removed stale $ASSET"
                    FILE="${ASSET%.xz}"
                    curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Content-Type: application/octet-stream" \
                        --data-binary @"${FILE}.xz" \
                        "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$ASSET" \
                        >/dev/null
                    echo "uploaded $ASSET to release $RID"
                done
            fi
