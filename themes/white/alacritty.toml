# theme colors — sourced via vellum theme symlink
[colors.primary]
background = "#ffffff"
foreground = "#000000"

[colors.cursor]
text = "#ffffff"
cursor = "#000000"

[colors.selection]
text = "#000000"
background = "#c0c0c0"

[colors.normal]
black   = "#e8e8e8"
red     = "#2a2a2a"
green   = "#3a3a3a"
yellow  = "#4a4a4a"
blue    = "#1a1a1a"
magenta = "#2e2e2e"
cyan    = "#3e3e3e"
white   = "#000000"

[colors.bright]
black   = "#808080"
red     = "#2a2a2a"
green   = "#3a3a3a"
yellow  = "#4a4a4a"
blue    = "#1a1a1a"
magenta = "#2e2e2e"
cyan    = "#3e3e3e"
white   = "#000000"
