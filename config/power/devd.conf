# Vellum power — react to AC adapter plug/unplug.
# Install to /usr/local/etc/devd/vellum-power.conf
# ACPI ACAD notify 0x80 = power source changed.
notify 10 {
    match "system"    "ACPI";
    match "subsystem" "ACAD";
    match "notify"    "0x80";
    action            "/usr/local/libexec/vellum-power ac";
};
