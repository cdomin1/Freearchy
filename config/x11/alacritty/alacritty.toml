# Vellum alacritty — colors come from the active theme symlink:
#   ~/.config/vellum/current/theme/alacritty.toml
import = ["~/.config/vellum/current/theme/alacritty.toml"]

[window]
padding = { x = 10, y = 10 }
opacity = 0.95
decorations = "none"

[font]
normal = { family = "monospace" }
size = 12
