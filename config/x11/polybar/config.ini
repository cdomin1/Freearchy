; Vellum polybar — Tokyo Night (Omarchy palette)
;
; FreeBSD note: polybar's cpu/memory/battery/network/alsa modules are
; Linux-only (/proc, /sys, netlink). Everything here uses EWMH-aware
; internal modules or custom/script shims on FreeBSD commands.

; colors come from the active theme symlink:
;   ~/.config/vellum/current/theme/polybar.ini  ([colors] section)
include-file = ${env:HOME}/.config/vellum/current/theme/polybar.ini

[bar/vellum]
width          = 100%
height         = 28
background     = ${colors.bg}
foreground     = ${colors.fg}
font-0         = monospace:size=10;3
border-size    = 0
padding-left   = 1
padding-right  = 1
module-margin  = 1

modules-left   = xworkspaces
modules-center = xwindow
modules-right  = wlan volume battery date

tray-position   = right
tray-background = ${colors.bg}
cursor-click    = pointer

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true

label-active              = %name%
label-active-foreground   = ${colors.bg}
label-active-background   = ${colors.accent}
label-active-padding      = 1

label-occupied            = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding    = 1

label-empty               = %name%
label-empty-foreground    = ${colors.fg-dim}
label-empty-padding       = 1

label-urgent              = %name%
label-urgent-background   = ${colors.urgent}
label-urgent-padding      = 1

[module/xwindow]
type = internal/xwindow
label       = %title:0:60:...%
label-empty = vellum
label-empty-foreground = ${colors.fg-dim}

[module/wlan]
type = custom/script
exec = sh -c 'ssid=$(ifconfig wlan0 2>/dev/null | awk "/ssid/ {print \$2; exit}"); echo "NET ${ssid:-down}"'
interval = 10
label = %output%

[module/volume]
type = custom/script
exec = mixer vol | awk '{print "VOL " $2}'
interval = 5
label = %output%

[module/battery]
type = custom/script
exec = acpiconf -i0 2>/dev/null | awk '/Remaining capacity/ {printf "BAT %s\n", $3} /State/ {if($3=="charging") printf "+ "}'
interval = 30
label = %output%

[module/date]
type = internal/date
interval = 30
date = %a %b %d
time = %H:%M
label = %date%   %time%
label-foreground = ${colors.fg}
