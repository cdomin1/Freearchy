# Vellum picom config — stock picom 13 (x11-wm/picom). Animations are
# native since picom 12 (animation scripts + presets), so no fork needed.

backend = "glx";
vsync = true;

corner-radius = 10;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

detect-rounded-corners = true;
detect-client-opacity = true;

# Panel and root window: square, unshadowed, not animated.
rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0; shadow = false; animations = (); },
);

# --- animations (Hyprland-ish) ---------------------------------------------
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    scale = 0.92; duration = 0.18; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.92; duration = 0.14; },
  # tiling moves/resizes glide instead of jumping (experimental upstream)
  { triggers = [ "geometry" ];      preset = "geometry-change"; duration = 0.18; },
);
