# Freearchy picom config — Hypr-ish: rounded corners, soft shadows, light blur.

backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'" ];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [ "window_type = 'dock'" ];

inactive-opacity = 1.0;
frame-opacity = 1.0;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

detect-rounded-corners = true;
detect-client-opacity = true;
