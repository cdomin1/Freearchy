# Vellum picom config — pijulius fork: spring-physics animations,
# rounded corners, soft shadows. MUST be run with --experimental-backends.

backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

detect-rounded-corners = true;
detect-client-opacity = true;

# --- pijulius animations ---------------------------------------------------
animations = true;
animation-for-open-window       = "zoom";      # Hyprland-ish open
animation-for-transient-window  = "slide-down"; # menus/dialogs drop in
animation-for-unmap-window      = "auto";
animation-for-workspace-switch-in  = "auto";
animation-for-workspace-switch-out = "auto";

# spring feel: stiffer = snappier
animation-stiffness    = 400;
animation-dampening    = 40;
animation-window-mass  = 1;
animation-delta        = 7;
animation-force-steps  = true;

animation-exclude = [ "window_type = 'dock'" ];
