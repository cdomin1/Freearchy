# Keybindings — Omarchy-consistent: SUPER-centric, app launching on the
# home row, workspaces on the number row.
#
# Caelestia-specific binds (sidebar, session, media controls) come from
# caelestia's own hyprland config installed with the shell; the launcher
# bind below uses quickshell's global-shortcut interface so it works today.

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER SHIFT, Q, exec, hyprctl dispatch exit
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo

# Caelestia shell
bind = SUPER, Space, global, caelestia:launcher
bind = SUPER, L, global, caelestia:lock

# Apps
bind = SUPER, E, exec, foot -e yazi
bind = SUPER SHIFT, E, exec, thunar
bind = SUPER, B, exec, firefox
bind = SUPER SHIFT, B, exec, foot -e btop

# Focus
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, semicolon, movefocus, r

# Move window
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, semicolon, movewindow, r

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Resize / media
binde = SUPER CTRL, H, resizeactive, -40 0
binde = SUPER CTRL, semicolon, resizeactive, 40 0
binde = SUPER CTRL, K, resizeactive, 0 -40
binde = SUPER CTRL, J, resizeactive, 0 40

bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
