# hypridle — screen idle/lock/DPMS.
# Caelestia ships its own lock via quickshell; hyprlock is the fallback.

general {
    lock_cmd = qs -c caelestia ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = qs -c caelestia ipc call lock lock || loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                       # 5 min — lock
    on-timeout = qs -c caelestia ipc call lock lock || pidof hyprlock || hyprlock
}

listener {
    timeout = 600                       # 10 min — display off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
