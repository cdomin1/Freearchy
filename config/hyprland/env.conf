# Environment for the Wayland session.

env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland

# App toolkit hints
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# FreeBSD: XDG_RUNTIME_DIR should come from turnstile (see packages/base.txt).
# If it's missing, hyprland will still start but portals/dbus integration break —
# `vellum doctor` flags this.
