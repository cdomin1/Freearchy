# freearchy — Hyprland configuration
# Omarchy-style split: this file sources the pieces below.
# Docs: https://wiki.hyprland.org  (FreeBSD notes inline)

monitor = ,preferred,auto,1

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/freearchy/current/theme/hyprland.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 2
    }
    shadow {
        enabled = true
    }
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
}
